name: Deploy to GitHub Pages

# 推送到 main 即自动部署；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true 会在首次运行时自动开启仓库的 Pages 功能
      # （用工作流自带的 GITHUB_TOKEN，无需人工去 Settings 点开关）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 纯静态站：只把页面真正要用的文件挑出来。
      # data/ 下只有 bank-real.js 会被 <script> 加载，其余是原始题库/辅助库/规范化备份，
      # 既用不到（合计 ~3.3MB）也没必要公开发布，所以逐个拷而不是整个 data/ 拷。
      - name: Stage site
        run: |
          mkdir -p _site/data
          cp index.html .nojekyll _site/
          cp -r assets _site/
          cp data/bank-real.js _site/data/
          echo "--- staged ---"
          find _site -type f | sort
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
